services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pg_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data+
  postgres_test:
    image: postgis/postgis:16-3.5
    container_name: postgres_test_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pg_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data+
volumes:
  postgres_data: